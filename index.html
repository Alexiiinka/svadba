<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Alexinka a Ondrix svadba</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="styl.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>
  <div class="container">
    <h1>Naša svadba</h1>
    <h2>Alexandra 💞 Ondřej</h2>
  </div>

  <div class="container" id="invite-form">
    <p>Zadaj pozývací kód a otvor detaily k pozvánke</p>

    <input
      type="text"
      id="code"
      placeholder="Napr. Ahoj24"
    />

    <button onclick="unlockInvite()">
      Otvoriť pozvánku
    </button>

    <p id="error"></p>
  </div>

  <div class = container id="wedding-content" style="display:none;">

    <h2 id="welcome"></h2>

    <p id="privitanie"></p>

    <h3>Dôležité informácie</h3>
    <div class="important-info">
      <h4>Svadobný obrad</h4>
      <p class="charm-text" id="dateOfWedding"></p>
      <p class="charm-text">Čas: 14:30</p>
      <p class="charm-text">Miesto: Kostel Sv. Petra a Pavla, Nová Říše 588 65 </p>
      <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d846.2511987218644!2d15.56426148089133!3d49.139197450796175!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x470d3b5b3cc31965%3A0x729d5684e2b81528!2sKostel%20sv.%20Petra%20a%20Pavla!5e0!3m2!1ssk!2scz!4v1779811369617!5m2!1ssk!2scz" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="important-info">
      <h4>Svadobná hostina</h4>
      <p class="charm-text">Miesto: Ranč Telč, Telč 588 56</p>
      <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2607.3956758623713!2d15.433576176950973!3d49.193053071379566!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x470d259dd7a6a0fd%3A0x9804a0a198fea25!2zUmFuxI0gVGVsxI0!5e0!3m2!1ssk!2scz!4v1779979490482!5m2!1ssk!2scz" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="important-info" id="ubytko" style="display:none;" >
      <h3>🥳 GRATULUJEME! 🥳</h3>
      <p id="MaUbytovanie"></p>
    </div>


  </div>

  
  
  
  
  <script src="script.js"></script>
</body>
<!-- trigger deployment -->
</html>
